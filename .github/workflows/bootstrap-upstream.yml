name: Bootstrap upstream RFPlayer files

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bootstrap-upstream.yml'

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch original GCE RFPlayer files
        run: |
          git clone --depth 1 https://github.com/gce-electronics/HA_RFPlayer.git /tmp/gce-rfplayer
          mkdir -p custom_components/rfplayer
          cp -rn /tmp/gce-rfplayer/custom_components/rfplayer/. custom_components/rfplayer/
          if [ ! -f LICENSE ]; then cp /tmp/gce-rfplayer/LICENSE LICENSE; fi
      - name: Commit missing upstream files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add custom_components/rfplayer LICENSE
          if git diff --cached --quiet; then
            echo "No missing upstream files."
            exit 0
          fi
          git commit -m "Add unchanged upstream GCE RFPlayer files"
          git push
